name: CI

on:
 push:
   branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Build CLI
        shell: bash
        run: |
          mkdir -p build
          go build -o build/gogguf$EXE ./cmd/gogguf
          go build -o build/tools$EXE ./cmd/tools
          set +e
          ./build/gogguf$EXE
          code=$?
          set -e
          test "$code" -eq 1
        env:
          EXE: ${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Cross-build CPU targets
        run: |
          set -e
          for t in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS=${t%/*} GOARCH=${t#*/} CGO_ENABLED=0 go build -o /dev/null ./cmd/gogguf
            echo "ok $t"
          done

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Download test models
        run: |
          mkdir -p models
          curl -L -o models/Qwen3-1.7B-Q8_0.gguf \
            https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
          curl -L -o models/Llama-3.2-1B-Instruct-Q8_0.gguf \
            https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf

      - name: Package tests with models
        run: go test -count=1 -timeout 15m ./pkg/model/qwen3/

      - name: Integration tests (Qwen3 + Llama)
        run: go test -tags=integration -count=1 -timeout 30m ./test/integration/...

  integration-mistral:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Download Mistral test model
        run: |
          mkdir -p models
          curl -L -o models/Mistral-7B-Instruct-v0.2-Q4_K_M.gguf \
            https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF/resolve/main/mistral-7b-instruct-v0.2.Q4_K_M.gguf

      - name: Integration tests (Mistral)
        run: go test -tags=integration -count=1 -timeout 30m -run 'TestMistral' ./test/integration/

  cuda:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: go.sum

      - name: Download Qwen3 test model
        run: |
          mkdir -p models
          curl -L -o models/Qwen3-1.7B-Q8_0.gguf \
            https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf

      - name: CUDA package tests
        run: |
          CGO_ENABLED=1 go test -tags=cuda -count=1 -timeout 20m \
            ./pkg/device/cuda/... \
            ./pkg/device/ \
            ./pkg/model/qwen3/ \
            ./pkg/model/llama/ \
            ./pkg/model/mistral/

      - name: CUDA + integration (CPU vs GPU; skip without GPU)
        run: |
          CGO_ENABLED=1 go test -tags='cuda,integration' -count=1 -timeout 30m \
            -run 'TestFullLayersCPUVsGPU|TestFullLogitsCPUVsGPU' \
            ./test/integration/
